<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الأوامر الذكية — لوحة التشغيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF0EC;
  --panel:#FFFFFF;
  --ink:#16221D;
  --ink-2:#4A5A52;
  --ink-3:#7B8A82;
  --frond:#2F5D4A;
  --frond-soft:#E2EBE4;
  --water:#1B6E8C;
  --water-soft:#DEEDF2;
  --hafeet:#B4703A;
  --hafeet-soft:#F5E7D9;
  --line:#CBD3CB;
  --line-2:#E1E7E1;
  --focus:#1B6E8C;
  --r:3px;
  --ar:"IBM Plex Sans Arabic","Dubai","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--ar);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--frond);color:#fff}

/* ---------- masthead ---------- */
.masthead{
  background:var(--ink);
  color:#EDF0EC;
  border-bottom:3px solid var(--frond);
}
.masthead-in{max-width:1440px;margin:0 auto;padding:18px 26px 0}
.brand{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand h1{
  margin:0;font-size:21px;font-weight:600;letter-spacing:-.2px;
}
.brand .sub{color:#93A79C;font-size:12.5px;font-weight:300;padding-bottom:3px}
.brand .tally{
  margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;
  color:#93A79C;letter-spacing:.06em;padding-bottom:4px;
}
.brand .tally b{color:#EDF0EC;font-weight:500}
.tabs{display:flex;gap:2px;margin-top:16px}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  color:#93A79C;padding:9px 16px;cursor:pointer;font-size:13.5px;font-weight:500;
}
.tab:hover{color:#EDF0EC}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--frond)}

/* ---------- shell ---------- */
.shell{max-width:1440px;margin:0 auto;padding:22px 26px 60px;display:grid;grid-template-columns:262px 1fr;gap:22px;align-items:start}
.view[hidden]{display:none}
.shell.wide{grid-template-columns:1fr}
.shell.wide .rail{display:none}

/* ---------- rail ---------- */
.rail{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.rail-sec{border-bottom:1px solid var(--line-2);padding:13px 14px}
.rail-sec:last-child{border-bottom:0}
.rail-h{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);
  text-transform:uppercase;margin:0 0 9px;font-weight:500;
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:var(--r);
  padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.chip:hover{border-color:var(--frond);color:var(--frond)}
.chip[aria-pressed="true"]{background:var(--frond);border-color:var(--frond);color:#fff}
.axis-list{list-style:none;margin:0;padding:0;max-height:400px;overflow:auto}
.axis-btn{
  width:100%;display:flex;gap:8px;align-items:baseline;background:none;border:0;
  padding:5px 6px;text-align:start;cursor:pointer;border-radius:var(--r);font-size:13px;color:var(--ink-2);
}
.axis-btn:hover{background:var(--frond-soft)}
.axis-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.axis-btn .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:18px}
.axis-btn[aria-pressed="true"] .n{color:#93A79C}
.axis-btn .c{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.axis-btn[aria-pressed="true"] .c{color:#93A79C}
.reset{width:100%;background:none;border:1px dashed var(--line);border-radius:var(--r);padding:7px;cursor:pointer;color:var(--ink-3);font-size:12.5px}
.reset:hover{border-color:var(--hafeet);color:var(--hafeet)}

/* ---------- register ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input{
  flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel);
}
.searchbar input::placeholder{color:var(--ink-3)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);align-self:center;letter-spacing:.05em}

.reg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.reg-head,.row{display:grid;grid-template-columns:88px 1fr 84px 96px 34px;gap:12px;align-items:center;padding:9px 14px}
.reg-head{
  background:#F4F7F3;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;
}
.row{border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-inline:0;width:100%;text-align:start;font-size:14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--frond-soft)}
.row .rid{font-family:var(--mono);font-size:12px;color:var(--water);font-weight:500}
.row .rt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rax{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.badge{font-size:11px;padding:2px 7px;border-radius:var(--r);border:1px solid;white-space:nowrap;display:inline-block}
.lv-أساسي{color:var(--frond);border-color:#B7CFC0;background:var(--frond-soft)}
.lv-متوسط{color:var(--water);border-color:#AFD1DD;background:var(--water-soft)}
.lv-متقدم{color:var(--hafeet);border-color:#E0C3A5;background:var(--hafeet-soft)}
.sens{font-family:var(--mono);font-size:11px;color:var(--ink-2);border-color:var(--line);background:#F4F7F3}
.sens.c4{color:var(--hafeet);border-color:#E0C3A5;background:var(--hafeet-soft);font-weight:500}
.pin{border:0;background:none;cursor:pointer;color:var(--line);font-size:16px;padding:2px;line-height:1}
.pin:hover{color:var(--water)}
.pin[aria-pressed="true"]{color:var(--water)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,34,29,.45);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-block:0;inset-inline-start:0;width:min(760px,100%);
  background:var(--ground);border-inline-end:1px solid var(--line);
  transform:translateX(-100%);transition:transform .22s ease;overflow:auto;z-index:5;
}
.sheet.on{transform:none}
.sheet-head{
  position:sticky;top:0;background:var(--ink);color:#EDF0EC;padding:16px 22px;
  display:flex;gap:14px;align-items:flex-start;z-index:2;
}
.sheet-head .sid{font-family:var(--mono);font-size:12px;color:#8FBECF;display:block;margin-bottom:2px}
.sheet-head h2{margin:0;font-size:18px;font-weight:600;line-height:1.45}
.x{margin-inline-start:auto;background:none;border:1px solid #3A4C44;color:#93A79C;border-radius:var(--r);cursor:pointer;padding:4px 11px;font-size:15px}
.x:hover{border-color:#93A79C;color:#fff}
.sheet-body{padding:20px 22px 70px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card h3{
  margin:0 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;font-weight:500;
}
.card p{margin:0;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* signature: composer */
.composer{border-color:var(--frond);border-width:1px;box-shadow:0 1px 0 var(--frond)}
.gauge{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.gauge-bar{flex:1;height:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.gauge-fill{height:100%;background:var(--frond);width:0;transition:width .2s}
.gauge-txt{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em}
.prompt{
  white-space:pre-wrap;background:#FBFCFB;border:1px solid var(--line-2);
  border-radius:var(--r);padding:13px 15px;line-height:2.25;font-size:14px;
}
.prompt input{
  border:0;border-bottom:1.5px solid var(--water);background:var(--water-soft);
  padding:1px 6px;border-radius:2px 2px 0 0;min-width:70px;color:var(--water);
  font-weight:500;font-size:13.5px;
}
.prompt input:hover{background:#CFE5EE}
.prompt input.done{background:var(--frond-soft);border-bottom-color:var(--frond);color:var(--frond)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);
  padding:8px 16px;cursor:pointer;font-size:13.5px;font-weight:500;
}
.btn:hover{background:#0E1815}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn.ok{background:var(--frond);border-color:var(--frond)}

.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:13.5px}
.checklist input{margin-top:6px;accent-color:var(--frond)}
.warn{
  background:var(--hafeet-soft);border:1px solid #E0C3A5;border-radius:var(--r);
  padding:10px 13px;font-size:13px;color:#7A4A21;margin-bottom:12px;
}

/* ---------- dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.stat-row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:4px 0;font-size:13px}
.stat-row .lbl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.stat-row .num{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.track{height:7px;background:var(--line-2);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--frond)}
.fill.w{background:var(--water)}
.fill.h{background:var(--hafeet)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi b{display:block;font-family:var(--mono);font-size:27px;font-weight:500;line-height:1.2;color:var(--frond)}
.kpi span{font-size:12px;color:var(--ink-3)}

/* ---------- basket ---------- */
.bk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.bk .bid{font-family:var(--mono);font-size:12px;color:var(--water)}
.bk .btit{flex:1;font-size:13.5px;font-weight:500}
.bk button{border:1px solid var(--line);background:none;border-radius:var(--r);cursor:pointer;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.bk button:hover{border-color:var(--hafeet);color:var(--hafeet)}

.toast{
  position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(50%) translateY(80px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--r);font-size:13.5px;
  opacity:0;transition:.22s;z-index:9;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(50%)}

@media(max-width:860px){
  .shell{grid-template-columns:1fr;padding:16px}
  .rail{position:static}
  .reg-head{display:none}
  .row{grid-template-columns:1fr 34px;gap:6px}
  .row .rid{grid-column:1}
  .row .rt{grid-column:1}
  .row .lvw,.row .sw{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .masthead,.rail,.searchbar,.acts,.scrim,.tabs,.pin{display:none!important}
  body{background:#fff}
  .sheet{position:static;transform:none;width:auto;border:0}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <div class="brand">
      <h1>مكتبة الأوامر الذكية</h1>
      <span class="sub">إدارة صيانة أصول التجميل الطبيعي — مدينة العين</span>
      <span class="tally">الإصدار الأول · <b id="tally">120</b> أمرًا · <b>20</b> محورًا</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="register">سجل الأوامر</button>
      <button class="tab" role="tab" aria-selected="false" data-view="dash">لوحة التغطية</button>
      <button class="tab" role="tab" aria-selected="false" data-view="basket">سلة العمل <span id="bkn"></span></button>
    </nav>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="rail view" id="rail">
    <div class="rail-sec">
      <p class="rail-h">المحور</p>
      <ul class="axis-list" id="axisList"></ul>
    </div>
    <div class="rail-sec">
      <p class="rail-h">مستوى الأمر</p>
      <div class="chips" id="lvChips"></div>
    </div>
    <div class="rail-sec">
      <p class="rail-h">حساسية البيانات</p>
      <div class="chips" id="snChips"></div>
    </div>
    <div class="rail-sec">
      <p class="rail-h">المهمة الرسمية</p>
      <div class="chips" id="tkChips"></div>
    </div>
    <div class="rail-sec">
      <button class="reset" id="reset">مسح كل عوامل التصفية</button>
    </div>
  </aside>

  <div>
    <!-- register -->
    <section class="view" id="v-register">
      <div class="searchbar">
        <input id="q" type="search" placeholder="ابحث برمز الأمر أو العنوان أو الغرض أو الكلمة المفتاحية…" aria-label="بحث">
        <span class="count" id="count"></span>
      </div>
      <div class="reg">
        <div class="reg-head">
          <span>الرمز</span><span>الأمر</span><span>المستوى</span><span>الحساسية</span><span></span>
        </div>
        <div id="rows"></div>
      </div>
    </section>

    <!-- dashboard -->
    <section class="view" id="v-dash" hidden></section>

    <!-- basket -->
    <section class="view" id="v-basket" hidden></section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside>

ف","tasks":[2,5,6],"purpose":"التحقق من اكتمال عرض المقاول ومعقولية الأسعار ومطابقته لنطاق أمر العمل .","inputs":"نطاق الأعمال، قائمة الكميات، عرض المقاول، الأسعار التعاقدية والمرجعية، البرنامج الزمني","output":"جدول تحليل أسعار وملاحظات فنية ومالية وتعاقدية","prompt":"الدور: تصرّف بصفتك مختصاً في مراجعة وتسعير أوامر العمل الحكومية .\nالمهمة: قم بمراجعة العرض الفني والمالي المقدم من [اسم المقاول] لتنفيذ أمر العمل الخاص بـ[اسم الموقع أو المشروع] .\nالسياق: تتعلق المراجعة بأعمال [وصف الأعمال] ضمن العقد رقم [رقم العقد] .\nالمدخلات: اعتمد على [نطاق الأعمال]، [قائمة الكميات]، [عرض المقاول]، [الأسعار التعاقدية]، [الأسعار المرجعية أو العروض المقارنة]، [البرنامج الزمني.\nمعايير التحليل: تحقق من مطابقة البنود للنطاق وصحة الوحدات والكميات والأسعار والقيم، واكشف البنود المكررة أو غير المطلوبة أو غير المسعرة. قارن الأسعار بالتعاقدية ثم المرجعية، مع إظهار المصدر ونسبة الفرق. حلل المدة والمواد والاستثناءات وشروط الدفع والمخاطر .\nالقيود: لا تعتبر السعر مقبولاً لمجرد وروده في عرض المقاول، ولا تنشئ سعراً مرجعياً غير موثق .\nالمخرجات: قدّم جدولاً يتضمن البند والكمية وسعر المقاول والسعر المرجعي والفرق والملاحظة والإجراء، ثم صنّف العرض أولياً: مستوفٍ للمراجعة، أو يحتاج استيضاحاً، أو تفاوضاً، أو إعادة تقديم .\nالتحقق: لا تصدر اعتماداً مالياً نهائياً، وحدد ما يحتاج إلى مراجعة فنية أو مالية أو تعاقدية .","example":"مراجعة عرض مالي لتطوير نظام ري وزراعة منطقة مفتوحة .","review":"مصادر الأسعار، والعمليات الحسابية والضريبة، وعدم تكرار البنود، والأساس التعاقدي .","keywords":"عرض المقاول، تحليل الأسعار، مراجعة مالية","variables":["اسم المقاول","اسم الموقع أو المشروع","الأسعار التعاقدية","الأسعار المرجعية أو العروض المقارنة","رقم العقد","عرض المقاول","قائمة الكميات","نطاق الأعمال","وصف الأعمال"]},{"id":"WO-005","code":"WO","title":"إعداد مسودة أمر العمل للاعتماد","axis":2,"axisTitle":"إدارة أوامر العمل","level":"متوسط","sensitivity":"C3","sensitivityLabel":"مقيّد","user":"مدير المشروع / المهندس المشرف / منسق العقود","tasks":[2,5],"purpose":"إعداد مسودة متكاملة لأمر العمل قبل استكمال الاعتمادات يانة/المواصفات/مؤشرات الأداء/مستوى الخدمة]، مع مراعاة الظروف المناخية والبيئية لمدينة العين.\nالمخرجات: قدّم النتيجة في صورة مسودة تقرير عدم مطابقة مع المرجع والأثر والمسؤول. حدّد المسؤول والإجراء والمدة المستهدفة متى كان ذلك مناسبًا.\nالقيود و\nالتحقق: لا تفترض معلومات أو كميات أو نسب إنجاز أو تكاليف غير مقدمة. حدّد البيانات الناقصة والتعارضات، وافصل بين الحقائق والملاحظات والاستنتاجات والتوصيات. تحقق خصوصًا من: البند والأدلة والصلاحيات. وضّح العناصر التي تحتاج إلى معاينة ميدانية أو اعتماد فني أو مالي أو تعاقدي أو قانوني، ولا تصدر اعتمادًا نهائيًا نيابة عن صاحب الصلاحية.","example":"عدم تنفيذ تكرار القص أو التقليم","review":"البند والأدلة والصلاحيات","keywords":"تقرير عدم مطابقة\n\n# المحور 05 | إدارة عقود الصيانة\n\nالرمز: CON | عدد الأوامر: 8 | يرتبط بالمهام الرسمية: 5، 6","variables":["العقد/خطة الصيانة/المواصفات/مؤشرات الأداء/مستوى الخدمة","الفترة","المشروع/العقد/الأصل/الموقع"]},{"id":"CON-001","code":"CON","title":"استخراج التزامات المقاول من العقد","axis":5,"axisTitle":"إدارة عقود الصيانة","level":"متقدم","sensitivity":"C3","sensitivityLabel":"مقيّد","user":"منسق العقود / مدير المشروع","tasks":[5,6],"purpose":"استخراج الالتزامات الصريحة وتصنيفها حسب التشغيل والموارد والتقارير والسلامة والجودة والبيانات والتسليم","inputs":"العقد والملاحق والمواصفات وجداول الخدمة","output":"سجل التزامات برقم البند والصفحة والتكرار ودليل الامتثال","prompt":"تصرّف بصفتك مدير مشروع حكومي متخصصًا في عقود ومشاريع الصيانة.\nالمهمة: استخراج الالتزامات الصريحة وتصنيفها حسب التشغيل والموارد والتقارير والسلامة والجودة والبيانات والتسليم، وتتعلق بـ[المشروع/العقد/الأصل/الموقع] خلال [الفترة].\nالمدخلات: اعتمد على البيانات والمرفقات التالية: العقد والملاحق والمواصفات وجداول الخدمة.\nمعايير التحليل: راجع النتيجة وفق [العقد/خطة الصيانة/المواصفات/مؤشرات الأداء/مستوى الخدمة]، مع مراعاة الظروف المناخية والبيئية لمدينة العين.\nالمخرجات: قدّم النتيجة في صورة سجل التزامات برقم البند والصفحة والتكرار ودليل الامتثال. حدّد المسؤول والإجراء والمدة المستهدفة متى كان ذلك مناسبًا.\nالقيود و\nالتحقق: لا تفترض معلومات أو كميات أو نسب إنجاز أو تكاليف غير مقدمة. حدّد البيانات الناقصة والتعارضات، وافصل بين الحقائق والملاحظات والاستنتاجات والتوصيات. تحقق خصوصًا من: النسخة المعتمدة والتفسير القانوني. وضّح العناصر التي تحتاج إلى معاينة ميدانية أو اعتماد فني أو مالي أو تعاقدي أو قانوني، ولا تصدر اعتمادًا نهائيًا نيابة عن صاحب الصلاحية.","example":"إعداد سجل التزامات مقاول الصيانة","review":"النسخة المعتمدة والتفسير القانوني","keywords":"استخراج التزامات المقاول من العقد","variables":["العقد/خطة الصيانة/المواصفات/مؤشرات الأداء/مستوى الخدمة","الفترة","المشروع/العقد/الأصل/الموقع"]},{"id":"CON-002","code":"CON","title":"مراجعة امتثال المقاول للعقد","axis":5,"axisTitle":"إدارة عقود الصيانة","level":"متقدم","sensitivity":"C3","sensitivityLabel":"مقيّد","user":"المهندس المشرف / منسق العقود","tasks":[5,6],"purpose":"مقارنة الالتزامات بالتقارير والتفتيش والبلاغات والموارد والمراسلات","inputs":"سجل الالتزامات، تقارير الأداء، الخطط، التفتيش، البلاغات","output":"مصفوفة ممتثل أو جزئي أو غير ممتثل أو دون دليل","prompt":"تصرّف بصفتك مهندسًا مشرفًا على تشغيل وصيانة أصول التجميل الطبيعي.\nالمهمة: مقارنة الالتزامات بالتقارير والتفتيش والبلاغات والموارد والمراسلات، وتتعلق بـ[المشروع/العقد/الأصل/الموقع] خلال [الفترة].\nالمدخلات: اعتمد على البيانات والمرفقات التالية: سجل الالتزامات، تقارير الأداء، الخطط، التفتيش، البلاغات.\nمعايير التحليل: راجع النتيجة وفق [العقد/خطة الصيانة/المواصفات/مؤشرات الأداء/مستوى الخدمة]، مع مراعاة الظروف المناخية والبيئية لمدينة العين.\nالمخرجات: قدّم النتيجة في صورة مصفوفة ممتثل أو جزئي أو غير ممتثل أو دون دليل. حدّد المسؤول والإجراء والمدة المستهدفة متى كان ذلك مناسبًا.\nالقيود و\nالتحقق: لا تفترض معلومات أو كميات أو نسب إنجاز أو تكاليف غير مقدمة. حدّد البيانات الناقصة والتعارضات، وافصل بين الحقائق والملاحظات والاستنتاجات والتوصيات. تحقق خصوصًا من: الأدلة ونطاق العقد وتفسير البنود. وضّح العناصر التي تحتاج إلى معاينة ميدانية أو اعتماد فني أو مالي أو تعاقدي أو قانوني، ولا تصدر اعتمادًا نهائيًا نيابة عن صاحب الصلاحية.","example":"مراجعة الالتزام بالتكرارات ومدد الإغلاق"," const mem = {};
const store = {
  async get(k){ try{ const r = await window.storage.get(k); return r? JSON.parse(r.value):(mem[k]??null);}catch(e){ return mem[k]??null; } },
  async set(k,v){ mem[k]=v; try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){} }
};

const state = {view:'register', q:'', axis:null, levels:new Set(), sens:new Set(), tasks:new Set(),
               open:null, values:{}, basket:[]};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._i); t._i=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- filtering ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return CMDS.filter(c=>{
    if(state.axis && c.axis!==state.axis) return false;
    if(state.levels.size && !state.levels.has(c.level)) return false;
    if(state.sens.size && !state.sens.has(c.sensitivity)) return false;
    if(state.tasks.size && !c.tasks.some(t=>state.tasks.has(t))) return false;
    if(!q) return true;
    return (c.id+' '+c.title+' '+c.purpose+' '+c.keywords+' '+c.axisTitle+' '+c.user+' '+c.output).toLowerCase().includes(q);
  });
}

/* ---------- rail ---------- */
function buildRail(){
  const counts = {}; CMDS.forEach(c=>counts[c.axis]=(counts[c.axis]||0)+1);
  $('#axisList').innerHTML = AXES.map(a=>
    `<li><button class="axis-btn" data-axis="${a.num}" aria-pressed="false">
      <span class="n">${String(a.num).padStart(2,'0')}</span>
      <span>${esc(a.title)}</span><span class="c">${counts[a.num]||0}</span></button></li>`).join('');

  $('#lvChips').innerHTML = ['أساسي','متوسط','متقدم'].map(l=>
    `<button class="chip" data-lv="${l}" aria-pressed="false">${l}</button>`).join('');
  $('#snChips').innerHTML = ['C2','C3','C4'].map(s=>
    `<button class="chip" data-sn="${s}" aria-pressed="false">${s} · ${SENS[s]}</button>`).join('');
  $('#tkChips').innerHTML = Object.keys(TASKS).map(t=>
    `<button class="chip" data-tk="${t}" aria-pressed="false" title="${esc(TASKS[t])}">${t}</button>`).join('');

  $('#axisList').addEventListener('click',e=>{
    const b=e.target.closest('[data-axis]'); if(!b) return;
    const n=+b.dataset.axis; state.axis = state.axis===n? null : n;
    [...$('#axisList').querySelectorAll('[data-axis]')].forEach(x=>x.setAttribute('aria-pressed', +x.dataset.axis===state.axis));
    render();
  });
  const chipHandler=(sel,key,cast)=>$(sel).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const v=cast(b.dataset[key]); const S=state[{lv:'levels',sn:'sens',tk:'tasks'}[key]];
    S.has(v)?S.delete(v):S.add(v); b.setAttribute('aria-pressed', S.has(v)); render();
  });
  chipHandler('#lvChips','lv',String); chipHandler('#snChips','sn',String); chipHandler('#tkChips','tk',Number);

  $('#reset').addEventListener('click',()=>{
    state.axis=null; state.levels.clear(); state.sens.clear(); state.tasks.clear(); state.q=''; $('#q').value='';
    document.querySelectorAll('[aria-pressed]').forEach(x=>{ if(!x.classList.contains('pin')) x.setAttribute('aria-pressed','false'); });
    render();
  });
}

/* ---------- register ---------- */
function render(){
  const list = filtered();
  $('#count').textContent = `${list.length} من ${CMDS.length}`;
  if(!list.length){
    $('#rows').innerHTML = `<div class="empty"><b>لا يوجد أمر مطابق</b>عدّل نص البحث أو امسح عوامل التصفية من اللوحة الجانبية.</div>`;
    return;
  }
  $('#rows').innerHTML = list.map(c=>`
    <button class="row" data-id="${c.id}">
      <span class="rid">${c.id}</span>
      <span class="rt">${esc(c.title)}<span class="rax">${String(c.axis).padStart(2,'0')} · ${esc(c.axisTitle)}</span></span>
      <span class="lvw"><span class="badge lv-${c.level}">${c.level}</span></span>
      <span class="sw"><span class="badge sens${c.sensitivity==='C4'?' c4':''}">${c.sensitivity} · ${SENS[c.sensitivity]||''}</span></span>
      <span class="pin" aria-pressed="${state.basket.includes(c.id)}" data-pin="${c.id}" title="أضف إلى سلة العمل">◆</span>
    </button>`).join('');
}
$('#rows').addEventListener('click',e=>{
  const pin=e.target.closest('[data-pin]');
  if(pin){ e.stopPropagation(); toggleBasket(pin.dataset.pin); pin.setAttribute('aria-pressed', state.basket.includes(pin.dataset.pin)); return; }
  const r=e.target.closest('[data-id]'); if(r) openSheet(r.dataset.id);
});

/* ---------- basket ---------- */
function toggleBasket(id){
  const i=state.basket.indexOf(id);
  i<0? state.basket.push(id) : state.basket.splice(i,1);
  store.set('basket', state.basket);
  $('#bkn').textContent = state.basket.length? `(${state.basket.length})` : '';
  if(state.view==='basket') renderBasket();
}
function renderBasket(){
  const el=$('#v-basket');
  if(!state.basket.length){
    el.innerHTML=`<div class="card"><div class="empty"><b>السلة فارغة</b>اختر أوامر من السجل بعلامة ◆ لتكوين تسلسل عمل — مثل: تفتيش ← تصنيف ملاحظات ← إشعار للمقاول ← متابعة الإغلاق.</div></div>`;
    return;
  }
  const items = state.basket.map(id=>CMDS.find(c=>c.id===id)).filter(Boolean);
  el.innerHTML = `<div class="card"><h3>تسلسل العمل المقترح</h3><p>${items.length} أمرًا بالترتيب. انسخ التسلسل كاملًا أو افتح كل أمر لتعبئة متغيراته.</p></div>`
    + items.map((c,i)=>`<div class="bk"><span class="bid">${String(i+1).padStart(2,'0')} · ${c.id}</span>
        <span class="btit">${esc(c.title)}</span>
        <button data-open="${c.id}">فتح</button><button data-del="${c.id}">إزالة</button></div>`).join('')
    + `<div class="acts"><button class="btn" id="copySeq">نسخ التسلسل كاملًا</button>
        <button class="btn ghost" id="clearSeq">تفريغ السلة</button></div>`;
}
$('#v-basket').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o) return openSheet(o.dataset.open);
  const d=e.target.closest('[data-del]'); if(d){ toggleBasket(d.dataset.del); render(); return; }
  if(e.target.id==='clearSeq'){ state.basket=[]; store.set('basket',[]); $('#bkn').textContent=''; renderBasket(); render(); }
  if(e.target.id==='copySeq'){
    const txt = state.basket.map((id,i)=>{ const c=CMDS.find(x=>x.id===id);
      return `— (${i+1}) ${c.id} | ${c.title} —\n${fillPrompt(c)}`; }).join('\n\n');
    copy(txt,'تم نسخ التسلسل');
  }
});

/* ---------- composer ---------- */
function fillPrompt(c){
  const v = state.values[c.id]||{};
  return c.prompt.replace(/\[([^\[\]]{2,60}?)\]/g,(m,p)=> (v[p] && v[p].trim()) ? v[p].trim() : m);
}
function promptHTML(c){
  const v = state.values[c.id]||{};
  let i=0;
  return esc(c.prompt).replace(/\[([^\[\]]{2,60}?)\]/g,(m,p)=>{
    const key=p, val=v[key]||'', opts=key.split('/').map(s=>s.trim()).filter(s=>s.length>1);
    const lid=`dl${c.id}_${i++}`;
    const dl = opts.length>1 ? `<datalist id="${lid}">${opts.map(o=>`<option value="${o}">`).join('')}</datalist>` : '';
    return `<input type="text" data-ph="${key}" value="${esc(val)}" placeholder="${key}"
              ${opts.length>1?`list="${lid}"`:''} class="${val?'done':''}"
              style="width:${Math.max(70,(val||key).length*8.5)}px">${dl}`;
  });
}
function updateGauge(c){
  const total=c.variables.length, v=state.values[c.id]||{};
  const done=c.variables.filter(p=>v[p]&&v[p].trim()).length;
  const pct = total? Math.round(done/total*100):100;
  const f=$('#gaugeFill'); if(f){ f.style.width=pct+'%'; $('#gaugeTxt').textContent=`${done} / ${total} حقل مُعبّأ · ${pct}%`; }
}

/* ---------- sheet ---------- */
function openSheet(id){
  const c=CMDS.find(x=>x.id===id); if(!c) return;
  state.open=id;
  const reviews = c.review.split(/،|,|\sو(?=[ا-ي])/).map(s=>s.trim()).filter(s=>s.length>2);
  $('#sheet').innerHTML = `
    <div class="sheet-head">
      <div><span class="sid">${c.id} · المحور ${String(c.axis).padStart(2,'0')} — ${esc(c.axisTitle)}</span>
      <h2 id="sheetTitle">${esc(c.title)}</h2></div>
      <button class="x" id="closeSheet" aria-label="إغلاق">✕</button>
    </div>
    <div class="sheet-body">
      <div class="meta">
        <span class="badge lv-${c.level}">المستوى: ${c.level}</span>
        <span class="badge sens${c.sensitivity==='C4'?' c4':''}">${c.sensitivity} · ${SENS[c.sensitivity]||''}</span>
        ${c.tasks.map(t=>`<span class="badge sens" title="${esc(TASKS[t]||'')}">مهمة ${t}</span>`).join('')}
      </div>
      ${c.sensitivity==='C4'?`<div class="warn">بيانات مصنّفة C4 — لا تُدخل أسماء أو أرقام عقود أو مبالغ حقيقية في أي أداة ذكاء اصطناعي خارجية. استبدلها برموز واحتفظ بالمفتاح داخل الجهة.</div>`:''}

      <div class="card"><h3>الغرض</h3><p>${esc(c.purpose)}</p></div>
      <div class="grid2">
        <div class="card"><h3>المدخلات المطلوبة</h3><p>${esc(c.inputs)}</p></div>
        <div class="card"><h3>شكل المخرج</h3><p>${esc(c.output)}</p></div>
      </div>
      <div class="card"><h3>المستخدم المستهدف</h3><p>${esc(c.user)}</p></div>

      <div class="card composer">
        <h3>مُركّب الأمر — عبّئ الحقول الزرقاء ثم انسخ</h3>
        <div class="gauge"><div class="gauge-bar"><div class="gauge-fill" id="gaugeFill"></div></div>
          <span class="gauge-txt" id="gaugeTxt"></span></div>
        <div class="prompt" id="promptBox">${promptHTML(c)}</div>
        <div class="acts">
          <button class="btn ok" id="copyBtn">نسخ الأمر</button>
          <button class="btn ghost" id="rawBtn">نسخ القالب الأصلي</button>
          <button class="btn ghost" id="clrBtn">تفريغ الحقول</button>
          <button class="btn ghost" id="bkBtn">${state.basket.includes(c.id)?'إزالة من السلة':'إضافة إلى سلة العمل'}</button>
        </div>
      </div>

      ${c.example?`<div class="card"><h3>مثال تطبيقي</h3><p>${esc(c.example)}</p></div>`:''}
      <div class="card">
        <h3>المراجعة البشرية قبل الاعتماد</h3>
        <ul class="checklist">${reviews.map((r,i)=>`<li><input type="checkbox" id="rv${i}"><label for="rv${i}">${esc(r)}</label></li>`).join('')}
        <li><input type="checkbox" id="rvf"><label for="rvf">لا يُعتمد المخرج نهائيًا إلا من صاحب الصلاحية الفنية أو المالية أو التعاقدية.</label></li></ul>
      </div>
    </div>`;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  updateGauge(c);
  $('#promptBox').addEventListener('input',e=>{
    const i=e.target; if(i.tagName!=='INPUT') return;
    state.values[c.id]=state.values[c.id]||{};
    state.values[c.id][i.dataset.ph]=i.value;
    i.classList.toggle('done', !!i.value.trim());
    i.style.width = Math.max(70,(i.value||i.dataset.ph).length*8.5)+'px';
    updateGauge(c);
  });
  $('#closeSheet').onclick=closeSheet;
  $('#copyBtn').onclick=()=>copy(fillPrompt(c),'تم نسخ الأمر — الصقه في أداة الذكاء الاصطناعي');
  $('#rawBtn').onclick=()=>copy(c.prompt,'تم نسخ القالب الأصلي');
  $('#clrBtn').onclick=()=>{ state.values[c.id]={}; openSheet(c.id); };
  $('#bkBtn').onclick=()=>{ toggleBasket(c.id); openSheet(c.id); render(); };
  $('#sheet').scrollTop=0;
  setTimeout(()=>$('#closeSheet').focus(),60);
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); state.open=null; }
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function copy(txt,msg){
  navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast(msg);
  });
}

/* ---------- dashboard ---------- */
function renderDash(){
  const byAxis={},byLv={},bySn={},byTask={},byUser={};
  CMDS.forEach(c=>{
    byAxis[c.axis]=(byAxis[c.axis]||0)+1;
    byLv[c.level]=(byLv[c.level]||0)+1;
    bySn[c.sensitivity]=(bySn[c.sensitivity]||0)+1;
    c.tasks.forEach(t=>byTask[t]=(byTask[t]||0)+1);
    c.user.split('/').map(s=>s.trim()).filter(Boolean).forEach(u=>byUser[u]=(byUser[u]||0)+1);
  });
  const maxA=Math.max(...Object.values(byAxis)), maxT=Math.max(...Object.values(byTask));
  const bar=(lbl,n,max,cls)=>`<div class="stat-row"><span class="lbl">${esc(lbl)}</span>
      <span class="track"><span class="fill ${cls||''}" style="width:${(n/max*100).toFixed(1)}%"></span></span>
      <span class="num">${n}</span></div>`;
  const topUsers=Object.entries(byUser).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxU=topUsers[0][1];

  $('#v-dash').innerHTML=`
    <div class="kpi">
      <div><b>${CMDS.length}</b><span>أمر ذكي</span></div>
      <div><b>${AXES.length}</b><span>محور تشغيلي</span></div>
      <div><b>15</b><span>مهمة رسمية مغطاة</span></div>
      <div><b>${bySn.C4||0}</b><span>أمر بحساسية C4</span></div>
    </div>
    <div class="dash-grid">
      <div class="card"><h3>توزيع الأوامر على المحاور</h3>
        ${AXES.map(a=>bar(`${String(a.num).padStart(2,'0')} · ${a.title}`, byAxis[a.num]||0, maxA)).join('')}</div>
      <div>
        <div class="card"><h3>تغطية المهام الرسمية الخمس عشرة</h3>
          ${Object.keys(TASKS).map(t=>bar(`${t} · ${TASKS[t]}`, byTask[t]||0, maxT,'w')).join('')}
          <p style="font-size:12.5px;color:var(--ink-3);margin-top:9px">المهام ذات التغطية الأدنى هي الأولوية الطبيعية للإصدار الثاني.</p></div>
        <div class="card"><h3>مستوى الأمر</h3>
          ${['أساسي','متوسط','متقدم'].map(l=>bar(l,byLv[l]||0,Math.max(...Object.values(byLv)),'h')).join('')}</div>
        <div class="card"><h3>حساسية البيانات</h3>
          ${['C2','C3','C4'].map(s=>bar(`${s} · ${SENS[s]}`,bySn[s]||0,Math.max(...Object.values(bySn)),'w')).join('')}</div>
        <div class="card"><h3>الوظائف الأكثر استخدامًا للمكتبة</h3>
          ${topUsers.map(([u,n])=>bar(u,n,maxU)).join('')}</div>
      </div>
    </div>`;
}

/* ---------- views ---------- */
document.querySelector('.tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  state.view=t.dataset.view;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));
  $('#v-register').hidden = state.view!=='register';
  $('#v-dash').hidden = state.view!=='dash';
  $('#v-basket').hidden = state.view!=='basket';
  $('#shell').classList.toggle('wide', state.view!=='register');
  if(state.view==='dash') renderDash();
  if(state.view==='basket') renderBasket();
});

$('#q').addEventListener('input',e=>{ state.q=e.target.value; render(); });

/* ---------- boot ---------- */
(async function(){
  const saved = await store.get('basket');
  if(Array.isArray(saved)) state.basket=saved;
  $('#bkn').textContent = state.basket.length? `(${state.basket.length})` : '';
  $('#tally').textContent = CMDS.length;
  buildRail(); render();
})();
})();
</script>
</body>
</html>
